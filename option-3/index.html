<style>
  :root{
    --or:#ff6a1a; --or-d:#e2540a; --cream:#fff7ef; --ink:#1d1a16; --muted:#6b645b; --line:#f0e3d4;
    --green:#16a34a; --navy:#14213d; --card:#ffffff; --radius:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Poppins","Noto Sans Devanagari",system-ui,sans-serif;background:var(--cream);color:var(--ink);line-height:1.6}
  a{color:inherit;text-decoration:none}
  svg{width:1.2em;height:1.2em;flex:none}
  .wrap{max-width:1080px;margin:0 auto;padding:0 18px}
  section{padding:64px 0}
  h2{font-size:clamp(1.6rem,3.4vw,2.3rem);line-height:1.2;letter-spacing:-.02em;margin-bottom:.5rem}
  .sub{color:var(--muted);margin-bottom:28px}
  .pill{display:inline-block;background:#ffe6d5;color:var(--or-d);font-weight:600;font-size:.8rem;padding:.3rem .8rem;border-radius:999px;margin-bottom:12px}

  /* top bar */
  .top{position:sticky;top:0;z-index:50;background:rgba(255,247,239,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:10px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;line-height:1.1}
  .brand .m{width:40px;height:40px;border-radius:12px;background:var(--or);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.2rem}
  .brand small{display:block;font-weight:500;color:var(--muted);font-size:.72rem}
  .top-r{display:flex;gap:8px;align-items:center}
  .lang{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
  .lang button{border:0;background:none;padding:.35rem .7rem;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--muted)}
  .lang button.on{background:var(--ink);color:#fff}
  .open-badge{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:.35rem .7rem;border-radius:999px;background:#fff;border:1.5px solid var(--line)}
  .open-badge i{width:8px;height:8px;border-radius:50%}
  @media(max-width:560px){.open-badge{display:none}}

  /* hero */
  .hero{padding:48px 0 30px}
  .hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:center}
  .hero h1{font-size:clamp(2rem,5.5vw,3.4rem);line-height:1.1;letter-spacing:-.03em;margin-bottom:14px}
  .hero h1 span{color:var(--or)}
  .hero p{color:var(--muted);font-size:1.05rem;max-width:480px}
  .art{position:relative;aspect-ratio:1;border-radius:40px;background:var(--or);overflow:hidden}
  .art::before{content:"";position:absolute;width:140%;height:140%;left:-20%;top:40%;border-radius:50%;background:var(--or-d)}
  .art .cam{position:absolute;left:12%;top:18%;width:76%;color:#fff}
  .art .cam svg{width:100%;height:auto}
  .art .bubble{position:absolute;right:8%;bottom:10%;background:#fff;border-radius:18px;padding:12px 16px;font-weight:600;font-size:.9rem;box-shadow:0 14px 30px rgba(0,0,0,.18);display:flex;gap:8px;align-items:center}
  .art .bubble svg{color:var(--green)}
  @media(max-width:820px){.hero-grid{grid-template-columns:1fr}.art{max-width:340px;margin:0 auto;order:-1;aspect-ratio:4/3}}

  /* action tiles */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:30px}
  .tile{background:var(--card);border-radius:var(--radius);padding:22px 18px;display:flex;flex-direction:column;gap:10px;border:1.5px solid var(--line);transition:.2s;cursor:pointer;text-align:left;font:inherit;color:inherit}
  .tile:hover{transform:translateY(-3px);box-shadow:0 16px 30px -18px rgba(0,0,0,.35)}
  .tile .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff}
  .tile .ic svg{width:24px;height:24px}
  .tile b{font-size:1.02rem}
  .tile small{color:var(--muted);font-size:.82rem;line-height:1.35}
  .t-call .ic{background:var(--or)} .t-wa .ic{background:var(--green)} .t-book .ic{background:var(--navy)} .t-map .ic{background:#7c3aed}
  @media(max-width:820px){.tiles{grid-template-columns:1fr 1fr}}

  /* services */
  .svc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .svc{background:var(--card);border-radius:var(--radius);padding:24px;display:grid;grid-template-columns:56px 1fr;gap:16px;border:1.5px solid var(--line)}
  .svc .ic{width:56px;height:56px;border-radius:16px;background:#ffe6d5;color:var(--or-d);display:grid;place-items:center}
  .svc .ic svg{width:28px;height:28px}
  .svc h3{font-size:1.08rem;margin-bottom:4px}
  .svc p{color:var(--muted);font-size:.93rem}
  @media(max-width:720px){.svc-grid{grid-template-columns:1fr}}

  /* why / chart */
  .why{background:var(--navy);color:#fff;border-radius:32px;padding:44px;display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center}
  .why .sub{color:#b8c1d6}
  .why ul{list-style:none;display:grid;gap:12px}
  .why li{display:flex;gap:10px;align-items:flex-start}
  .why li svg{color:var(--or);margin-top:4px}
  .hours-chart{background:#1c2b4d;border-radius:22px;padding:22px}
  .hours-chart h4{font-size:.95rem;margin-bottom:4px}
  .hours-chart p{color:#b8c1d6;font-size:.8rem;margin-bottom:16px}
  .hc-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px}
  .hc-bar{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .hc-bar div{width:100%;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--or),#ff9a5a);height:0;transition:height .9s cubic-bezier(.2,.8,.2,1)}
  .hc-bar.today div{background:linear-gradient(180deg,#fff,#ffd2b5)}
  .hc-bar span{font-size:.72rem;color:#b8c1d6}
  .hc-bar.today span{color:#fff;font-weight:700}
  .hc-line{display:flex;justify-content:space-between;font-size:.75rem;color:#b8c1d6;margin-top:10px}
  @media(max-width:820px){.why{grid-template-columns:1fr;padding:28px}}

  /* segments */
  .seg{display:flex;flex-wrap:wrap;gap:10px}
  .seg span{background:#fff;border:1.5px solid var(--line);padding:.55rem 1rem;border-radius:14px;font-weight:600;font-size:.92rem}

  /* reviews */
  .rev{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .r{background:#fff;border-radius:var(--radius);padding:22px;border:1.5px solid var(--line)}
  .r .st{color:#f59e0b;display:flex;gap:2px;margin-bottom:10px}
  .r p{margin-bottom:14px}
  .r .who{display:flex;gap:10px;align-items:center}
  .r .av{width:40px;height:40px;border-radius:50%;background:var(--or);color:#fff;font-weight:700;display:grid;place-items:center}
  .r b{display:block;font-size:.92rem;line-height:1.2}
  .r small{color:var(--muted);font-size:.8rem}
  @media(max-width:820px){.rev{grid-template-columns:1fr}}

  /* FAQ */
  .faq details{background:#fff;border:1.5px solid var(--line);border-radius:16px;margin-bottom:10px;padding:16px 20px}
  .faq summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
  .faq summary::after{content:"+";font-size:1.4rem;line-height:1;color:var(--or)}
  .faq details[open] summary::after{content:"−"}
  .faq details p{color:var(--muted);margin-top:10px}

  /* contact */
  .cbox{background:#fff;border-radius:32px;border:1.5px solid var(--line);display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
  .cinfo{padding:36px}
  .cinfo .line{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px dashed var(--line)}
  .cinfo .line:last-child{border:0}
  .cinfo .ic{width:44px;height:44px;border-radius:12px;background:#ffe6d5;color:var(--or-d);display:grid;place-items:center}
  .cinfo small{display:block;color:var(--muted);font-size:.78rem}
  .cinfo b{word-break:break-word}
  .cinfo .copy{margin-left:auto;border:1.5px solid var(--line);background:none;border-radius:10px;padding:.35rem .7rem;font:inherit;font-size:.78rem;cursor:pointer}
  .cmap iframe{width:100%;height:100%;min-height:360px;border:0;display:block}
  @media(max-width:820px){.cbox{grid-template-columns:1fr}.cinfo{padding:24px}}

  footer{padding:30px 0 110px;text-align:center;color:var(--muted);font-size:.85rem}
  footer a{color:var(--or-d);font-weight:600}

  /* bottom app bar */
  .appbar{position:fixed;left:12px;right:12px;bottom:12px;z-index:60;background:var(--ink);border-radius:20px;display:grid;grid-template-columns:repeat(4,1fr);padding:8px;box-shadow:0 20px 40px rgba(0,0,0,.3);max-width:520px;margin:0 auto}
  .appbar a,.appbar button{display:flex;flex-direction:column;align-items:center;gap:2px;color:#d9d3cb;font:inherit;font-size:.72rem;font-weight:600;padding:8px 0;border-radius:14px;background:none;border:0;cursor:pointer}
  .appbar a svg,.appbar button svg{width:22px;height:22px}
  .appbar .main{background:var(--or);color:#fff}

  /* booking sheet */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;opacity:0;pointer-events:none;transition:.25s}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;background:#fff;border-radius:28px 28px 0 0;padding:22px 20px 28px;transform:translateY(105%);transition:.3s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto;max-height:92vh;overflow:auto}
  .open .sheet-bg{opacity:1;pointer-events:auto}
  .open .sheet{transform:none}
  .sheet .grab{width:44px;height:5px;border-radius:9px;background:#ddd;margin:0 auto 16px}
  .sheet h3{font-size:1.3rem}
  .sheet .s{color:var(--muted);font-size:.9rem;margin-bottom:16px}
  .stepper{display:flex;gap:6px;margin-bottom:18px}
  .stepper i{flex:1;height:4px;border-radius:4px;background:var(--line)}
  .stepper i.on{background:var(--or)}
  .choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .choice button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px;font:inherit;font-weight:600;cursor:pointer;text-align:left}
  .choice button.on{border-color:var(--or);background:#fff2e8;color:var(--or-d)}
  .sheet input,.sheet textarea{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:14px;padding:.85rem 1rem;margin-bottom:10px}
  .sheet input:focus,.sheet textarea:focus{outline:none;border-color:var(--or)}
  .sheet .nav{display:flex;gap:10px;margin-top:16px}
  .sheet .nav button{flex:1;padding:.9rem;border-radius:14px;font:inherit;font-weight:700;cursor:pointer;border:1.5px solid var(--line);background:#fff}
  .sheet .nav .go{background:var(--or);border-color:var(--or);color:#fff}
  .sheet .err{color:#c2410c;font-size:.85rem;min-height:1.2em}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:.7rem 1.2rem;border-radius:999px;font-size:.88rem;opacity:0;transition:.25s;z-index:100;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>

      chartTitle:"हम हर दिन उपलब्ध हैं", chartNote:"खुलने का समय", forPill:"किसके लिए", forTitle:"हर तरह की जगह को सुरक्षित करते हैं",
      revPill:"रिव्यू", revTitle:"हमारे ग्राहक क्या कहते हैं", revSub:"स्कूल, ट्रस्ट और संस्थाएँ हम पर भरोसा करती हैं।", faqTitle:"आम सवाल",
      faq:[["इंस्टॉलेशन कितनी जल्दी होगा?","कॉल या व्हाट्सऐप करें — हम जल्दी साइट विज़िट करते हैं और कोटेशन मंज़ूर होते ही इंस्टॉल करते हैं।"],["क्या मैं मोबाइल पर कैमरा देख सकता हूँ?","हाँ। हम आपके मोबाइल पर लाइव व्यू सेट करते हैं, कहीं से भी देखें।"],["क्या आप पुराने सीसीटीवी ठीक करते हैं?","हाँ, हम पुराने कैमरा, रिकॉर्डर और वायरिंग की जाँच, रिपेयर या अपग्रेड करते हैं।"],["आप किन इलाकों में सेवा देते हैं?","हम " + C.area + " में हैं और नवी मुंबई व रायगढ़ के आसपास सेवा देते हैं। पूछिए!"]],
      conPill:"संपर्क", conTitle:"सब कुछ एक ही जगह", conSub:"अब ढूँढना नहीं — कॉल, चैट, ईमेल या विज़िट करें।", bCall:"कॉल", bBook:"बुक", bContact:"संपर्क",
      sheetSub:"बस 3 बातें बताइए। हम व्हाट्सऐप पर पुष्टि करेंगे।", back:"पीछे", next:"आगे", send:"व्हाट्सऐप पर भेजें",
      q1:"आपको क्या चाहिए?", q2:"जगह कहाँ है?", q3:"आपकी जानकारी", name:"आपका नाम", phone:"मोबाइल नंबर", place:"इलाका / पता (जैसे खारघर सेक्टर 12)", note:"और कुछ? (वैकल्पिक)",
      eName:"कृपया नाम और 10 अंकों का मोबाइल नंबर लिखें।", ePlace:"कृपया अपना इलाका लिखें।", copied:"कॉपी हो गया!", openNow:"अभी खुला है", closed:"बंद · सुबह 8 बजे खुलेगा", copy:"कॉपी",
      lPhone:"फ़ोन", lWa:"व्हाट्सऐप", lMail:"ईमेल", lInsta:"इंस्टाग्राम", lLoc:"पता", lHours:"समय", waChat:"हमसे चैट करें"}
  };
  let lang = "en";
  try { lang = localStorage.getItem("me-lang") || "en"; } catch(e) {}
  const t = k => L[lang][k];

  const text = {name:S.name, promise:S.promise, phone:C.phone, area:C.area, state:C.state, hours:C.hours};
  const hrefs = {tel:H.telLink(), wa:H.waLink(), map:H.mapLink()};
  $$("[data-t]").forEach(el => el.textContent = text[el.dataset.t]);
  $$("[data-href]").forEach(el => { el.href = hrefs[el.dataset.href]; if (el.dataset.href !== "tel") { el.target = "_blank"; el.rel = "noopener"; } });
  $$("[data-i]").forEach(el => el.insertAdjacentHTML("afterbegin", H.icon(el.dataset.i)));
  $("#yr").textContent = new Date().getFullYear();
  $("#map").src = H.mapEmbed();

  const toast = m => { const el = $("#toast"); el.textContent = m; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 1600); };

  function paint(){
    document.documentElement.lang = lang;
    $$("[data-k]").forEach(el => el.innerHTML = t(el.dataset.k));
    $$(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
    $("#svc").innerHTML = S.services.map(s => `<div class="svc"><div class="ic">${H.icon(s.icon)}</div><div><h3>${s.title}</h3><p>${s.text}</p></div></div>`).join("");
    $("#whyList").innerHTML = t("why").map(w => `<li>${H.icon("consult")}<span>${w}</span></li>`).join("");
    $("#seg").innerHTML = S.segments.map(s => `<span>${s}</span>`).join("");
    $("#rev").innerHTML = S.testimonials.map(r => `<div class="r"><div class="st">${H.icon("star").repeat(5)}</div><p>“${r.text}”</p><div class="who"><span class="av">${r.name[0]}</span><span><b>${r.name}</b><small>${r.place}</small></span></div></div>`).join("");
    $("#faq").innerHTML = t("faq").map(([q,a]) => `<details><summary>${q}</summary><p>${a}</p></details>`).join("");
    const rows = [
      {i:"phone", l:t("lPhone"), v:C.phone, h:H.telLink(), c:C.phone},
      {i:"whatsapp", l:t("lWa"), v:t("waChat"), h:H.waLink(), e:1},
      {i:"mail", l:t("lMail"), v:C.email, h:H.mailLink("CCTV enquiry"), c:C.email},
      {i:"insta", l:t("lInsta"), v:"@enterprises.manisha", h:C.instagram, e:1},
      {i:"pin", l:t("lLoc"), v:C.area + ", " + C.state, h:H.mapLink(), e:1},
      {i:"clock", l:t("lHours"), v:C.hours}
    ];
    $("#cinfo").innerHTML = rows.map(r => `<div class="line"><span class="ic">${H.icon(r.i)}</span><${r.h?"a":"span"} ${r.h?`href="${r.h}"`:""} ${r.e?'target="_blank" rel="noopener"':""}><small>${r.l}</small><b>${r.v}</b></${r.h?"a":"span"}>${r.c?`<button class="copy" data-copy="${r.c}">${t("copy")}</button>`:""}</div>`).join("");
    $$("[data-copy]").forEach(b => b.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(b.dataset.copy).then(() => toast(t("copied"))); });
    // open-now badge (8:00–22:00 local time)
    const h = new Date().getHours(), open = h >= 8 && h < 22;
    $("#openBadge i").style.background = open ? "#16a34a" : "#dc2626";
    $("#openBadge span").textContent = open ? t("openNow") : t("closed");
    drawSheet();
  }
  $$(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.lang; try { localStorage.setItem("me-lang", lang); } catch(e) {} paint(); });

  // "graph": open hours per weekday, animates when visible
  const days = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"], today = (new Date().getDay() + 6) % 7;
  $("#hcBars").innerHTML = days.map((d,i) => `<div class="hc-bar ${i===today?"today":""}"><div data-h="100"></div><span>${d}</span></div>`).join("");
  new IntersectionObserver((es,o) => es.forEach(e => { if (e.isIntersecting) { $$(".hc-bar div").forEach((b,i) => setTimeout(() => b.style.height = "100%", i*80)); o.disconnect(); } }), {threshold:.4}).observe($("#hcBars"));

  // ---------- booking sheet (3 steps -> WhatsApp) ----------
  const bk = {step:0, need:S.enquiryTypes[0], prop:S.propertyTypes[0], place:"", name:"", phone:"", note:""};
  const root = $("#sheetRoot");
  const openSheet = () => { bk.step = 0; drawSheet(); root.classList.add("open"); };
  const closeSheet = () => root.classList.remove("open");
  $$("[data-open=book]").forEach(b => b.onclick = openSheet);
  $$("[data-close]").forEach(b => b.onclick = closeSheet);
  addEventListener("keydown", e => e.key === "Escape" && closeSheet());

  function saveInputs(){ $$("#sheetBody [data-f]").forEach(i => bk[i.dataset.f] = i.value.trim()); }
  function drawSheet(){
    const b = $("#sheetBody"); $("#sh-err").textContent = "";
    $$(".stepper i").forEach((s,i) => s.classList.toggle("on", i <= bk.step));
    if (bk.step === 0) {
      b.innerHTML = `<b style="display:block;margin-bottom:10px">${t("q1")}</b><div class="choice">${S.enquiryTypes.map(o => `<button class="${o===bk.need?"on":""}">${o}</button>`).join("")}</div>`;
      $$("#sheetBody .choice button").forEach((x,i) => x.onclick = () => { bk.need = S.enquiryTypes[i]; drawSheet(); });
    } else if (bk.step === 1) {
      b.innerHTML = `<b style="display:block;margin-bottom:10px">${t("q2")}</b><div class="choice" style="margin-bottom:12px">${S.propertyTypes.map(o => `<button class="${o===bk.prop?"on":""}">${o}</button>`).join("")}</div><input data-f="place" placeholder="${t("place")}" value="${bk.place}">`;
      $$("#sheetBody .choice button").forEach((x,i) => x.onclick = () => { saveInputs(); bk.prop = S.propertyTypes[i]; drawSheet(); });
    } else {
      b.innerHTML = `<b style="display:block;margin-bottom:10px">${t("q3")}</b><input data-f="name" placeholder="${t("name")}" value="${bk.name}"><input data-f="phone" type="tel" placeholder="${t("phone")}" value="${bk.phone}"><textarea data-f="note" rows="2" placeholder="${t("note")}">${bk.note}</textarea>`;
    }
    $("#sh-back").style.visibility = bk.step ? "visible" : "hidden";
    $("#sh-next").textContent = bk.step < 2 ? t("next") : t("send");
  }
  $("#sh-back").onclick = () => { saveInputs(); bk.step--; drawSheet(); };
  $("#sh-next").onclick = () => {
    saveInputs();
    if (bk.step === 1 && !bk.place) return $("#sh-err").textContent = t("ePlace");
    if (bk.step < 2) { bk.step++; return drawSheet(); }
    if (!bk.name || bk.phone.replace(/\D/g,"").length < 10) return $("#sh-err").textContent = t("eName");
    window.open(H.waLink(`Hello ${S.name}, I want to book a site visit.\n\nNeed: ${bk.need}\nProperty: ${bk.prop}\nArea: ${bk.place}\nName: ${bk.name}\nMobile: ${bk.phone}\nNote: ${bk.note || "-"}`), "_blank");
    closeSheet();
  };

  paint();
})();
</script>
</body>
</html>
